services:
  db:
    image: postgres:15-alpine
    container_name: anclav_db
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  bot:
    build: .
    container_name: anclav_bot
    restart: always
    command: python BOT.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  sync:
    build: .
    container_name: anclav_sync
    restart: always
    command: python sync_aqsi.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    container_name: anclav_api
    restart: always
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  weather:
    build: .
    container_name: anclav_weather
    restart: always
    command: python weather_worker.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
